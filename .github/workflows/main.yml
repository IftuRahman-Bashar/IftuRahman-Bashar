name: Randomize profile banner

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  random-banner:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select one of the ship banners
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          banners=(assets/banners/*.gif)

          if [ "${#banners[@]}" -lt 2 ]; then
            echo "ERROR: Need at least two GIF files in assets/banners/"
            printf 'Found: %s\n' "${banners[@]}"
            exit 1
          fi

          index=$(shuf -i 0-$((${#banners[@]} - 1)) -n 1)
          chosen="${banners[$index]}"

          cp "$chosen" assets/current-banner.gif
          echo "Selected banner: $chosen"

      - name: Commit banner if it changed
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/current-banner.gif

          if git diff --cached --quiet; then
            echo "Banner unchanged; no commit needed."
          else
            git commit -m "chore: randomize profile banner"
            git push
          fi
```
